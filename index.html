    $("#shuffleBtn").addEventListener("click", () => { rebuildQueue(true); toast(t('tShuffled')); });
    $("#deckSelect").addEventListener("change", () => { ui.deckFilter = $("#deckSelect").value; rebuildQueue(); });

    // 키보드 단축키 (학습 페이지에서만)
    document.addEventListener("keydown", (e) => {
      if (!$("#page-study").classList.contains("active")) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.code === "Space") { e.preventDefault(); flip(); }
      else if (e.code === "ArrowRight") next();
      else if (e.code === "ArrowLeft") prev();
      else if (e.key === "1") mark("unknown");
      else if (e.key === "2") mark("known");
    });

    /* ============================ 관리: 사전 검색 ============================ */
    async function doSearch() {
      const q = $("#searchInput").value.trim();
      if (!q) { toast(t('tSearchWord'), true); return; }
      const btn = $("#searchBtn"); const box = $("#results");
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
      box.innerHTML = `<div style="color:var(--text-light);font-size:13px;padding:6px 2px;">${esc(t('searching'))}</div>`;
      try {
        const items = await apiSearch(q);
        if (!items.length) { box.innerHTML = `<div style="color:var(--text-light);font-size:13px;padding:6px 2px;">${esc(t('noResults'))}</div>`; return; }
        box.innerHTML = items.map((it, i) => `
          <div class="result" data-i="${i}">
            <div class="info">
              <div class="kline"><span class="kw">${esc(it.word)}</span>${it.pron ? `<span class="kp">[${esc(it.pron)}]</span>` : ""}${it.pos ? `<span class="badge">${esc(posT(it.pos))}</span>` : ""}${it.grade ? `<span class="badge">${esc(gradeT(it.grade))}</span>` : ""}</div>
              ${jaMain(it) ? `<div class="jw ja">${esc(jaMain(it))}${jaIsDef(it) ? ` <span class="ja-tag">${esc(t('tagDef'))}</span>` : ""}</div>` : ""}
              ${it.definition ? `<div class="kd">${esc(it.definition)}</div>` : ""}
            </div>
            <button class="mini-btn add-btn" data-i="${i}">${ic('plus')} ${esc(t('btnAdd'))}</button>
          </div>`).join("");
        $$("#results .add-btn").forEach(b => b.addEventListener("click", async () => {
          const it = items[+b.dataset.i];
          b.disabled = true; b.innerHTML = '<span class="spin"></span>';
          const detail = await apiViewDetail(it.targetCode);
          addWord({ ...it, example: detail.example, pronFileNo: detail.pronFileNo, deck: $("#targetDeck").value });
          b.innerHTML = ic('check') + " " + t('added');
        }));
      } catch (e) {
        box.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:6px 2px;">${esc(e.message)}</div>`;
        toast(e.message, true);
      } finally { btn.disabled = false; btn.textContent = t('btnSearch'); }
    }
    $("#searchBtn").addEventListener("click", doSearch);
    $("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

    function addWord(o) {
      if (!o.deck) o.deck = db.decks[0];
      if (db.words.some(w => w.word === o.word && w.meaning === o.meaning && w.deck === o.deck)) {
        toast(t('tAddDup'), true); return;
      }
      const w = mkWord(o); db.words.push(w); save();
      markNew(w.id);
      toast(t('tAddedName', o.word));
      renderManage();
    }
    // 새로 추가한 단어는 목록 맨 위에 강조 표시 → 전체 보기 중이었다면 기본 목록으로 되돌려 보이게 한다
    function markNew(id) {
      newIds.add(id);
      listView.mode = "recent"; listView.page = 1; listView.q = "";
      const s = $("#listSearch"); if (s) s.value = "";
    }

    /* ============================ 관리: 직접 추가/수정 폼 ============================ */
    $("#manualForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const id = $("#editId").value;
      const data = {
        word: $("#fWord").value.trim(), pron: $("#fPron").value.trim(),
        meaning: $("#fMeaning").value.trim(), example: $("#fExample").value.trim(),
        deck: $("#fDeck").value,
      };
      if (!data.word || !data.meaning) { toast(t('tNeedFields'), true); return; }
      if (id) {
        const w = db.words.find(x => x.id === id);
        if (w) { Object.assign(w, data); save(); toast(t('tEdited')); }
        resetForm();
      } else {
        const w = mkWord(data); db.words.push(w); save();
        markNew(w.id); toast(t('tAddedName', data.word));
        e.target.reset();
      }
      renderManage();
    });
    $("#cancelEdit").addEventListener("click", resetForm);
    function resetForm() {
      $("#editId").value = ""; $("#manualForm").reset();
      $("#submitBtn").textContent = t('btnAdd'); $("#cancelEdit").style.display = "none";
      syncDeckSelects();
    }
    function editWord(id) {
      const w = db.words.find(x => x.id === id); if (!w) return;
      $("#editId").value = w.id; $("#fWord").value = w.word; $("#fPron").value = w.pron;
      $("#fMeaning").value = w.meaning; $("#fExample").value = w.example;
      syncDeckSelects(); $("#fDeck").value = w.deck;
      $("#submitBtn").textContent = t('btnEditSave'); $("#cancelEdit").style.display = "inline-flex";
      $("#fWord").scrollIntoView({ behavior: "smooth", block: "center" }); $("#fWord").focus();
    }
    function delWord(id) {
      const w = db.words.find(x => x.id === id); if (!w) return;
      if (!confirm(t('cfDelWord', w.word))) return;
      db.words = db.words.filter(x => x.id !== id); save(); toast(t('tDeleted')); renderManage();
    }

    /* ============================ 관리: 단어장(덱) ============================ */
    function syncDeckSelects() {
      const opts = db.decks.map(d => `<option value="${esc(d)}">${esc(d.length > 14 ? d.slice(0, 14) + "…" : d)}</option>`).join("");
      $("#fDeck").innerHTML = opts; $("#targetDeck").innerHTML = opts;
    }
    function renderDeckManage() {
      const bar = $("#deckManageBar");
      const activeDeck = (listView.mode === "all") ? listView.deck : null;
      // '전체' 칩 + 덱별 칩. 칩 본체 = 전체 보기 진입(그 덱으로 필터), ✕ = 삭제
      const allChip = `<button class="chip deck-chip${activeDeck === "__all__" ? " active" : ""}" data-d="__all__">${esc(t('chipAll'))} <span class="chip-n">${db.words.length}</span></button>`;
      bar.innerHTML = allChip + db.decks.map(d => {
        const n = db.words.filter(w => w.deck === d).length;
        return `<span class="chip deck-chip-wrap${activeDeck === d ? " active" : ""}">
          <button class="deck-chip-body" data-d="${esc(d)}">${esc(d)} <span class="chip-n">${n}</span></button>
          <button class="link-btn del-deck" data-d="${esc(d)}" style="color:var(--danger); margin-left:6px;" aria-label="${esc(d)} 삭제">${ic('x')}</button></span>`;
      }).join("") + `<button class="mini-btn" id="addDeck">${ic('plus')} ${esc(t('btnNewDeck'))}</button>`;
      // 칩 본체 클릭 → 그 단어장 전체 보기
      $$("#deckManageBar .deck-chip, #deckManageBar .deck-chip-body").forEach(b => b.addEventListener("click", (e) => {
        e.stopPropagation();
        openAllView(b.dataset.d);
      }));
      $("#addDeck").addEventListener("click", () => {
        const name = prompt(t('promptNewDeck'));
        if (!name) return;
        const nm = name.trim(); if (!nm) return;
        if (db.decks.includes(nm)) { toast(t('tDeckExists'), true); return; }
        db.decks.push(nm); save(); renderManage(); toast(t('tDeckCreated', nm));
      });
      $$("#deckManageBar .del-deck").forEach(b => b.addEventListener("click", (e) => {
        e.stopPropagation();                                  // 칩 본체(전체 보기 진입)로 전파 방지
        const d = b.dataset.d;
        if (db.decks.length <= 1) { toast(t('tDeckMin'), true); return; }
        const n = db.words.filter(w => w.deck === d).length;
        if (!confirm(t('cfDelDeck', d, n))) return;
        db.words = db.words.filter(w => w.deck !== d);
        db.decks = db.decks.filter(x => x !== d);
        if (ui.deckFilter === d) ui.deckFilter = "__all__";
        if (listView.deck === d) { listView.deck = "__all__"; listView.page = 1; }
        save(); renderManage(); toast(t('tDeckDeleted'));
      }));
    }

    /* ============================ 관리: 단어 목록 ============================ */
    /*
     * 두 가지 모드로 동작한다.
     *   recent — 기본. 최근 추가한 RECENT_N개만. 검색·필터 없음. 목적은 "방금 추가한 게 들어갔나" 확인.
     *   all    — '단어장 전체 보기'. 검색 + 덱 필터 + 정렬 + 페이지네이션(PAGE_N개씩).
     * 어느 모드든 한 번에 그리는 항목 수에 상한이 있어 단어가 수천 개여도 렌더 비용이 일정하다.
     */
    const RECENT_N = 10, PAGE_N = 20;
    let listView = { mode: "recent", page: 1, q: "", deck: "__all__", sort: "new" };
    const newIds = new Set();       // 이번 세션에 추가한 단어 → 목록에서 강조
    const animated = new Set();     // fade-in을 이미 재생한 단어 → 재렌더 시 반복 방지

    // 목록 헤더를 화면 위로 — sticky nav(64px) 아래로 들어가지 않게 오프셋 보정
    function scrollListTop() {
      const el = $("#listHead"); if (!el) return;
      const nav = document.querySelector("nav");
      const off = (nav ? nav.getBoundingClientRect().height : 64) + 12;
      // 모드/페이지 전환은 내용이 통째로 바뀌므로 부드러운 스크롤보다 즉시 이동이 자연스럽다
      window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - off));
    }
    function openAllView(deck) {
      listView.mode = "all"; listView.page = 1; listView.deck = deck || "__all__";
      renderManage();
      scrollListTop();
    }
    function closeAllView() {
      listView.mode = "recent"; listView.page = 1; listView.q = "";
      $("#listSearch").value = "";
      renderManage(); scrollListTop();
    }

    // 필터 → 정렬까지 적용된 전체 목록(슬라이스 전)
    function listWords() {
      const order = new Map(db.words.map((w, i) => [w.id, i]));   // 저장 순서(입력 순) — createdAt 동률 시 보조 기준
      let ws = db.words.slice();
      if (listView.mode === "all") {
        if (listView.deck !== "__all__") ws = ws.filter(w => w.deck === listView.deck);
        const q = listView.q.trim().toLowerCase();
        if (q) ws = ws.filter(w =>
          w.word.toLowerCase().includes(q) || (w.meaning || "").toLowerCase().includes(q) ||
          (w.transDfn || "").toLowerCase().includes(q) ||
          (w.pron || "").toLowerCase().includes(q) || (w.example || "").toLowerCase().includes(q));
      }
      if (listView.mode === "all" && listView.sort === "az") ws.sort((a, b) => a.word.localeCompare(b.word, "ko"));
      else ws.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0) || order.get(b.id) - order.get(a.id));
      return ws;
    }

    function itemHtml(w) {
      const isNew = newIds.has(w.id);
      const anim = isNew && !animated.has(w.id);   // 이 단어의 첫 렌더에서만 fade-in
      if (anim) animated.add(w.id);
      return `
        <div class="item${isNew ? " is-new" : ""}${anim ? " just-added" : ""}">
          <span class="status-dot ${w.status === "known" ? "known" : w.status === "unknown" ? "unknown" : ""}" title="${w.status}"></span>
          <div class="info">
            <div><span class="iw">${esc(w.word)}</span>${w.pron ? `<span class="ip">[${esc(w.pron)}]</span>` : ""} <span class="deck-tag">${esc(w.deck)}</span>${isNew ? `<span class="new-tag">${esc(t('tagNew'))}</span>` : ""}</div>
            <div class="im ja">${jaMain(w) ? esc(jaMain(w)) : `<span style="color:var(--text-light)">${esc(t('noJa'))}</span>`}${jaIsDef(w) ? ` <span class="ja-tag">${esc(t('tagDef'))}</span>` : ""}</div>
            ${w.example ? `<div class="ie">${esc(w.example)}</div>` : ""}
          </div>
          <div class="item-acts">
            <button class="sq edit" data-id="${esc(w.id)}" title="수정" aria-label="수정">${ic('pencil')}</button>
            <button class="sq del" data-id="${esc(w.id)}" title="삭제" aria-label="삭제">${ic('trash')}</button>
          </div>
        </div>`;
    }

    // 페이저에 찍을 번호들: 1, 현재±1, 마지막 (사이가 벌어지면 …)
    function pageNums(cur, total) {
      const keep = [...new Set([1, cur - 1, cur, cur + 1, total])].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
      const out = []; let prev = 0;
      for (const n of keep) { if (prev && n - prev > 1) out.push("…"); out.push(n); prev = n; }
      return out;
    }

    function renderWordList() {
      const isAll = listView.mode === "all";
      const all = listWords();
      const total = all.length;
      const head = $("#listHead"), tools = $("#listTools"), footer = $("#listFooter");

      /* --- 헤더 --- */
      if (isAll) {
        const scope = listView.deck === "__all__" ? t('mngAllWords') : listView.deck;
        head.innerHTML = `<h2 style="margin:0; display:flex; align-items:center;">
          <button class="back-btn" id="listBack" title="${esc(t('listBack'))}" aria-label="${esc(t('listBack'))}">${ic('chevL')}</button>
          <span>${esc(scope)}</span> <span class="count" style="margin-left:8px;">${esc(t('countUnit', total))}</span></h2>`;
        $("#listBack").addEventListener("click", closeAllView);
      } else {
        head.innerHTML = `<h2 style="margin:0;">${ic('list')}<span style="margin-left:7px;">${esc(t('mngMyWords'))}</span>
          <span class="count" id="wordCount">${esc(t('countUnit', db.words.length))}</span></h2>`;
        head.querySelector(".ic").style.color = "var(--primary)";
      }

      /* --- 도구줄(전체 보기에서만) --- */
      tools.hidden = !isAll;
      if (isAll) {
        const trunc = (s) => (s.length > 14 ? s.slice(0, 14) + "…" : s);
        const deckOpts = [{ k: "__all__", label: t('chipAll') }].concat(decksList().map(d => ({ k: d, label: d })));
        $("#listDeck").innerHTML = deckOpts.map(o =>
          `<option value="${esc(o.k)}"${listView.deck === o.k ? " selected" : ""}>${esc(trunc(o.label))}</option>`).join("");
        $("#listDeck").value = listView.deck;
        $("#listSort").innerHTML = [["new", t('sortNew')], ["az", t('sortAz')]].map(([k, label]) =>
          `<option value="${k}"${listView.sort === k ? " selected" : ""}>${esc(label)}</option>`).join("");
        $("#listSort").value = listView.sort;
      }

      /* --- 항목 --- */
      let shown, pages = 1;
      if (isAll) {
        pages = Math.max(1, Math.ceil(total / PAGE_N));
        if (listView.page > pages) listView.page = pages;
        shown = all.slice((listView.page - 1) * PAGE_N, listView.page * PAGE_N);
      } else {
        shown = all.slice(0, RECENT_N);
      }

      if (!total) {
        const msg = isAll ? (listView.q.trim() ? t('listNoResult') : t('listAllEmpty')) : t('listEmpty');
        $("#wordList").innerHTML = `<div style="color:var(--text-light);font-size:13px;padding:8px 2px;">${esc(msg)}</div>`;
      } else {
        const sub = (!isAll && total > RECENT_N) ? `<div class="list-sub">${esc(t('listRecent'))}</div>` : "";
        $("#wordList").innerHTML = sub + shown.map(itemHtml).join("");
      }

      /* --- 하단: 전체 보기 버튼 / 페이저 --- */
      if (!isAll) {
        footer.innerHTML = (total > RECENT_N)
          ? `<button class="view-all" id="viewAll">${esc(t('btnViewAll', total))} ${ic('chevR')}</button>` : "";
        if (total > RECENT_N) $("#viewAll").addEventListener("click", () => openAllView("__all__"));
      } else if (pages > 1) {
        const cur = listView.page;
        const nums = pageNums(cur, pages).map(n => n === "…"
          ? `<span class="gap">…</span>`
          : `<button class="pg${n === cur ? " on" : ""}" data-p="${n}">${n}</button>`).join("");
        footer.innerHTML = `<div class="pager">
          <button class="pg" data-p="${cur - 1}"${cur === 1 ? " disabled" : ""} aria-label="이전">${ic('chevL')}</button>
          ${nums}
          <button class="pg" data-p="${cur + 1}"${cur === pages ? " disabled" : ""} aria-label="다음">${ic('chevR')}</button>
          <span class="pinfo">${esc(t('countUnit', total))}</span></div>`;
        $$("#listFooter .pg").forEach(b => b.addEventListener("click", () => {
          const p = +b.dataset.p;
          if (!p || p < 1 || p > pages || p === listView.page) return;
          listView.page = p; renderWordList(); scrollListTop();
        }));
      } else {
        footer.innerHTML = "";
      }
    }

    // 목록 컨트롤 — 이벤트 위임 1회 바인딩(항목마다 붙이지 않는다)
    $("#wordList").addEventListener("click", (e) => {
      const b = e.target.closest("button.edit, button.del"); if (!b) return;
      (b.classList.contains("edit") ? editWord : delWord)(b.dataset.id);
    });
    let listSearchTimer = 0;
    $("#listSearch").addEventListener("input", (e) => {
      clearTimeout(listSearchTimer);
      const v = e.target.value;
      listSearchTimer = setTimeout(() => { listView.q = v; listView.page = 1; renderWordList(); }, 180);
    });
    $("#listDeck").addEventListener("change", (e) => { listView.deck = e.target.value; listView.page = 1; renderManage(); });
    $("#listSort").addEventListener("change", (e) => { listView.sort = e.target.value; listView.page = 1; renderWordList(); });

    /* ============================ 내보내기 / 가져오기 ============================ */
    /* ============================ 가나(오십음도) 학습 ============================ */
    const KANA = {
      seion: [
        [["a","あ"],["i","い"],["u","う"],["e","え"],["o","お"]],
        [["ka","か"],["ki","き"],["ku","く"],["ke","け"],["ko","こ"]],
        [["sa","さ"],["shi","し"],["su","す"],["se","せ"],["so","そ"]],
        [["ta","た"],["chi","ち"],["tsu","つ"],["te","て"],["to","と"]],
        [["na","な"],["ni","に"],["nu","ぬ"],["ne","ね"],["no","の"]],
        [["ha","は"],["hi","ひ"],["fu","ふ"],["he","へ"],["ho","ほ"]],
        [["ma","ま"],["mi","み"],["mu","む"],["me","め"],["mo","も"]],
        [["ya","や"],null,["yu","ゆ"],null,["yo","よ"]],
        [["ra","ら"],["ri","り"],["ru","る"],["re","れ"],["ro","ろ"]],
        [["wa","わ"],null,null,null,["wo","を"]],
        [["n","ん"],null,null,null,null],
      ],
      dakuten: [
        [["ga","が"],["gi","ぎ"],["gu","ぐ"],["ge","げ"],["go","ご"]],
        [["za","ざ"],["ji","じ"],["zu","ず"],["ze","ぜ"],["zo","ぞ"]],
        [["da","だ"],["ji","ぢ"],["zu","づ"],["de","で"],["do","ど"]],
        [["ba","ば"],["bi","び"],["bu","ぶ"],["be","べ"],["bo","ぼ"]],
        [["pa","ぱ"],["pi","ぴ"],["pu","ぷ"],["pe","ぺ"],["po","ぽ"]],
      ],
      yoon: [
        [["kya","きゃ"],["kyu","きゅ"],["kyo","きょ"]],
        [["sha","しゃ"],["shu","しゅ"],["sho","しょ"]],
        [["cha","ちゃ"],["chu","ちゅ"],["cho","ちょ"]],
        [["nya","にゃ"],["nyu","にゅ"],["nyo","にょ"]],
        [["hya","ひゃ"],["hyu","ひゅ"],["hyo","ひょ"]],
        [["mya","みゃ"],["myu","みゅ"],["myo","みょ"]],
        [["rya","りゃ"],["ryu","りゅ"],["ryo","りょ"]],
        [["gya","ぎゃ"],["gyu","ぎゅ"],["gyo","ぎょ"]],
        [["ja","じゃ"],["ju","じゅ"],["jo","じょ"]],
        [["bya","びゃ"],["byu","びゅ"],["byo","びょ"]],
        [["pya","ぴゃ"],["pyu","ぴゅ"],["pyo","ぴょ"]],
      ],
    };
    function toKatakana(h) {
      return [...h].map(c => { const n = c.charCodeAt(0); return (n >= 0x3041 && n <= 0x3096) ? String.fromCharCode(n + 0x60) : c; }).join("");
    }
    function kanaGlyph(h) { return ui.kanaScript === "kata" ? toKatakana(h) : h; }
    function speakKana(h) { speakTTS(h, "ja-JP"); }
    function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function kanaGridCells(rows) {
      return rows.flat().map(c => c
        ? `<button class="kana-cell" data-h="${esc(c[1])}"><span class="kc ja">${esc(kanaGlyph(c[1]))}</span><span class="kr">${esc(c[0])}</span></button>`
        : `<span class="kana-cell empty"></span>`).join("");
    }
    function renderKanaChart() {
      $("#kanaBody").innerHTML =
        `<div class="kana-section"><h2>청음 (清音)</h2><div class="kana-grid">${kanaGridCells(KANA.seion)}</div></div>
         <div class="kana-section"><h2>탁음·반탁음 (濁音·半濁音)</h2><div class="kana-grid">${kanaGridCells(KANA.dakuten)}</div></div>
         <div class="kana-section"><h2>요음 (拗音)</h2><div class="kana-grid yoon">${kanaGridCells(KANA.yoon)}</div></div>
         <p class="kana-hint">글자를 누르면 발음이 나옵니다 ${ic('volume')}</p>`;
      $$("#kanaBody .kana-cell[data-h]").forEach(b => b.addEventListener("click", () => speakKana(b.dataset.h)));
    }

    let quiz = null;
    function kanaQuizPool() {
      const seen = new Set(), items = [];
      [KANA.seion, KANA.dakuten, KANA.yoon].forEach(g => g.flat().forEach(c => {
        if (c && !seen.has(c[0])) { seen.add(c[0]); items.push({ romaji: c[0], h: c[1] }); }
      }));
      return items;
    }
    function renderKanaQuiz() {
      if (!quiz) quiz = { dir: "k2r", score: 0, total: 0 };
      quiz.pool = kanaQuizPool();
      $("#kanaBody").innerHTML =
        `<div class="quiz-top">
           <div class="seg" id="quizDir">
             <button data-dir="k2r" class="${quiz.dir === "k2r" ? "active" : ""}">글자 → 읽기</button>
             <button data-dir="r2k" class="${quiz.dir === "r2k" ? "active" : ""}">읽기 → 글자</button>
           </div>
           <div class="quiz-score">점수 <b id="qScore">${quiz.score} / ${quiz.total}</b></div>
         </div>
         <div id="quizArea"></div>`;
      $$("#quizDir button").forEach(b => b.addEventListener("click", () => {
        $$("#quizDir button").forEach(x => x.classList.remove("active")); b.classList.add("active");
        quiz.dir = b.dataset.dir; nextKanaQuestion();
      }));
      nextKanaQuestion();
    }
    function nextKanaQuestion() {
      const pool = quiz.pool;
      const ans = pool[Math.floor(Math.random() * pool.length)];
      const opts = [ans];
      let guard = 0;
      while (opts.length < 4 && guard++ < 200) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        if (!opts.some(o => o.romaji === c.romaji)) opts.push(c);
      }
      shuffleArr(opts);
      const dir = quiz.dir;
      const promptHTML = dir === "k2r"
        ? `<div class="quiz-glyph ja">${esc(kanaGlyph(ans.h))}</div>`
        : `<div class="quiz-glyph romaji">${esc(ans.romaji)}</div>`;
      const optHTML = opts.map(o =>
        `<button class="quiz-opt ${dir === "r2k" ? "ja" : ""}" data-r="${esc(o.romaji)}">${esc(dir === "k2r" ? o.romaji : kanaGlyph(o.h))}</button>`).join("");
      $("#quizArea").innerHTML = `<button class="spk quiz-spk" id="qSpk" title="발음 듣기">${ic('volume')}</button>${promptHTML}<div class="quiz-opts">${optHTML}</div>`;
      $("#qSpk").addEventListener("click", () => speakKana(ans.h));
      $$("#quizArea .quiz-opt").forEach(b => b.addEventListener("click", () => answerKana(b, ans)));
    }
    function answerKana(btn, ans) {
      quiz.total++;
      const correct = btn.dataset.r === ans.romaji;
      if (correct) quiz.score++;
      $$("#quizArea .quiz-opt").forEach(b => {
        b.disabled = true;
        if (b.dataset.r === ans.romaji) b.classList.add("correct");
        else if (b === btn) b.classList.add("wrong");
      });
      $("#qScore").textContent = `${quiz.score} / ${quiz.total}`;
      speakKana(ans.h);
      setTimeout(nextKanaQuestion, correct ? 750 : 1400);
    }
    function renderKana() {
      if (ui.kanaMode === "chart") renderKanaChart();
      else renderKanaQuiz();
    }
    $$("#kanaScript button").forEach(b => b.addEventListener("click", () => {
      $$("#kanaScript button").forEach(x => x.classList.remove("active")); b.classList.add("active");
      ui.kanaScript = b.dataset.script; renderKana();
    }));
    $$("#kanaMode button").forEach(b => b.addEventListener("click", () => {
      $$("#kanaMode button").forEach(x => x.classList.remove("active")); b.classList.add("active");
      ui.kanaMode = b.dataset.mode; renderKana();
    }));

    /* ============================ 첫 접속 튜토리얼 ============================ */
    const TUT_KEY = "jpko_tutorial_seen";
    const TUTORIALS = {
      ko: [
        { icon: "book", title: "일본어 단어장에 오신 걸 환영해요", desc: "국립국어원 사전으로 <b>한국어–일본어 단어</b>를 만들고, 카드로 외우고, <b>히라가나·가타카나</b>까지 연습할 수 있어요." },
        { icon: "search", title: "① 단어 추가하기", desc: "<b>‘단어 관리’</b>에서 한국어를 검색하면 일본어 뜻·발음·예문이 <b>자동 완성</b>! <b>＋추가</b>만 누르면 끝이에요.",
          visual: `<div class="tut-demo"><div class="tut-demo-search"><span>${ic('search')}</span><span class="kw">바다</span><span class="tut-demo-btn">검색</span></div><div class="tut-demo-arrow">↓</div><div class="tut-demo-result"><div class="info"><span class="kw">바다</span><span class="kp">[바다]</span><div class="jp ja">うみ【海】</div></div><span class="tut-demo-add pulse">${ic('plus')} 추가</span></div></div>` },
        { icon: "refresh", title: "② 카드로 학습하기", desc: "<b>‘학습’</b> 탭에서 카드를 눌러 뒤집고, 발음 버튼으로 소리를 듣고, 외운/모르는 단어를 표시하세요. 한→일·일→한 방향도 바꿀 수 있어요." },
        { icon: "type", title: "③ 가나 익히기", desc: "<b>‘가나’</b> 탭에서 오십음도 표로 발음을 듣거나, <b>퀴즈</b>로 히라가나·가타카나를 연습하세요." },
      ],
      ja: [
        { icon: "book", title: "韓国語単語帳へようこそ", desc: "国立国語院の辞書で<b>韓国語の単語</b>を集め、カードで覚えられます。日本語の意味・発音・例文も自動で入ります。" },
        { icon: "search", title: "① 単語を追加", desc: "<b>「単語管理」</b>で韓国語を検索すると、意味・発音・例文が<b>自動入力</b>。<b>＋追加</b>を押すだけ。",
          visual: `<div class="tut-demo"><div class="tut-demo-search"><span>${ic('search')}</span><span class="kw">바다</span><span class="tut-demo-btn">検索</span></div><div class="tut-demo-arrow">↓</div><div class="tut-demo-result"><div class="info"><span class="kw">바다</span><span class="kp">[바다]</span><div class="jp ja">うみ【海】</div></div><span class="tut-demo-add pulse">${ic('plus')} 追加</span></div></div>` },
        { icon: "refresh", title: "② カードで学習", desc: "<b>「学習」</b>タブでカードをめくり、発音を聞き、覚えた/まだの単語を記録します。韓→日・日→韓の方向も切替できます。" },
      ],
    };
    function tutorialSteps() { return TUTORIALS[lang] || TUTORIALS.ko; }
    let tutStep = 0;
    function renderTutorial() {
      const steps = tutorialSteps();
      const s = steps[tutStep];
      $("#tutBody").innerHTML = `<div class="tut-icon">${ic(s.icon, "ic-xl")}</div><h2 class="tut-title">${esc(s.title)}</h2><p class="tut-desc">${s.desc}</p>${s.visual || ""}`;
      $("#tutDots").innerHTML = steps.map((_, i) => `<span class="tut-dot ${i === tutStep ? "active" : ""}"></span>`).join("");
      $("#tutPrev").style.visibility = tutStep === 0 ? "hidden" : "visible";
      $("#tutPrev").textContent = t('tutPrev');
      $("#tutSkip").textContent = t('tutSkip');
      $("#tutNext").textContent = tutStep === steps.length - 1 ? t('tutStart') : t('tutNext');
    }
    function openTutorial() { tutStep = 0; $("#tutorial").style.display = "flex"; renderTutorial(); }
    function closeTutorial() { $("#tutorial").style.display = "none"; localStorage.setItem(TUT_KEY, "1"); }
    $("#tutNext").addEventListener("click", () => { if (tutStep < tutorialSteps().length - 1) { tutStep++; renderTutorial(); } else closeTutorial(); });
    $("#tutPrev").addEventListener("click", () => { if (tutStep > 0) { tutStep--; renderTutorial(); } });
    $("#tutSkip").addEventListener("click", closeTutorial);
    $("#helpBtn").addEventListener("click", openTutorial);

    /* ============================ 언어 선택 / 전환 ============================ */
    function reRenderAll() {
      applyI18n();
      renderManage();
      rebuildQueue();
      // 다크/라이트 재적용 불필요. 현재 페이지 유지.
      if ($("#page-kana").classList.contains("active")) {
        if (lang === "ja") { switchPage("study"); } else { renderKana(); }
      }
    }
    function switchPage(p) {
      $$(".tab").forEach(x => x.classList.remove("active"));
      const tab = $(`.tab[data-page="${p}"]`); if (tab) tab.classList.add("active");
      $("#page-study").classList.toggle("active", p === "study");
      $("#page-manage").classList.toggle("active", p === "manage");
      $("#page-kana").classList.toggle("active", p === "kana");
    }
    $$("#langPicker .lang-choice").forEach(b => b.addEventListener("click", () => {
      lang = b.dataset.lang; localStorage.setItem(LANG_KEY, lang);
      $("#langPicker").style.display = "none";
      reRenderAll();
      openTutorial();     // 선택한 언어로 튜토리얼
    }));
    $("#langBtn").addEventListener("click", () => {
      lang = (lang === "ja") ? "ko" : "ja"; localStorage.setItem(LANG_KEY, lang);
      reRenderAll();
    });

    /* ============================ 렌더 오케스트레이션 ============================ */
    function renderManage() { syncDeckSelects(); renderDeckManage(); renderWordList(); }

    // 초기화
    applyI18n();
    renderManage();
    rebuildQueue();
    pingApi();
    if (!lang) {
      $("#langPicker").style.display = "flex";           // 첫 실행: 언어 선택
    } else if (!localStorage.getItem(TUT_KEY)) {
      openTutorial();                                    // 언어는 있고 튜토리얼 미확인
    }

    // PWA 서비스 워커 등록 (오프라인 + 설치)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
    }
  })();
  </script>
</body>
</html>
